version: '3.8'

services:
  wa-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlhk-wa-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=*
      - WA_API_TOKEN=your_secure_api_token_here
      - AI_PROVIDER=gemini
      - AI_API_KEY=your_gemini_api_key_here
      - AI_MODEL=gemini-2.0-flash
    volumes:
      - wa-sessions:/app/data/sessions

volumes:
  wa-sessions:
