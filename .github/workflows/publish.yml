name: Build & Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  publish:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Publish Packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @mlhk/types publish --access public --no-git-checks
          pnpm --filter @mlhk/wa-core publish --access public --no-git-checks
          pnpm --filter @mlhk/ai-agent publish --access public --no-git-checks
          pnpm --filter @mlhk/plugin-catalog publish --access public --no-git-checks
          pnpm --filter @mlhk/wa-server publish --access public --no-git-checks
          pnpm --filter @mlhk/wa-cli publish --access public --no-git-checks
